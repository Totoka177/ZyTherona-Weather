<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <!-- GOOGLE VERIFICATION — IDE ILLESZD A SAJÁT KÓDOD -->
  <meta name="google-site-verification" content="PASTE_GOOGLE_CODE_HERE">

  <!-- SEO -->
  <title>ZyTherona Weather – Satellite Weather App</title>
  <meta name="description" content="ZyTherona Weather is a satellite weather app with real-time temperature, precipitation, and global search.">
  <meta name="keywords" content="ZyTherona Weather, weather, satellite, weather app">
  <meta name="author" content="ZyTherona">

  <!-- MapLibre -->
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet"/>
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

  <style>
    body{
      margin:0;
      font-family:Arial, sans-serif;
      background:black;
      color:white;
      overflow:hidden;
    }

    #map{
      position:fixed;
      inset:0;
      z-index:0;
    }

    .panel{
      position:absolute;
      top:20px;
      left:20px;
      background:rgba(0,0,0,0.6);
      padding:15px;
      border-radius:12px;
      backdrop-filter: blur(10px);
      z-index:1;
      width:300px;
    }

    input{
      width:100%;
      padding:10px;
      border-radius:8px;
      border:none;
      outline:none;
      margin-bottom:10px;
    }

    button{
      width:100%;
      padding:10px;
      border-radius:8px;
      border:none;
      background:#3399ff;
      color:white;
      font-weight:bold;
      cursor:pointer;
    }

    button:hover{
      background:#2288ee;
    }

    .result{
      margin-top:10px;
    }

    h1{
      margin:0 0 10px 0;
      font-size:20px;
    }
  </style>
</head>

<body>

<div id="map"></div>

<div class="panel">
  <h1>ZyTherona Weather</h1>

  <input id="city" placeholder="Város neve...">
  <button onclick="searchCity()">Keresés</button>

  <div class="result" id="result"></div>
</div>

<script>
const satelliteStyle = {
  version: 8,
  sources: {
    satellite: {
      type: "raster",
      tiles: [
        "https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"
      ],
      tileSize: 256
    }
  },
  layers: [{
    id: "satellite",
    type: "raster",
    source: "satellite"
  }]
};

const map = new maplibregl.Map({
  container: "map",
  style: satelliteStyle,
  center: [19,47],
  zoom: 4
});

let marker;

async function searchCity(){

  const city = document.getElementById("city").value;

  const geo = await fetch(
    `https://geocoding-api.open-meteo.com/v1/search?name=${city}`
  ).then(r=>r.json());

  if(!geo.results){
    document.getElementById("result").innerHTML="Nem található.";
    return;
  }

  const place = geo.results[0];

  const lat = place.latitude;
  const lon = place.longitude;

  map.flyTo({
    center:[lon,lat],
    zoom:12
  });

  if(marker) marker.remove();

  marker = new maplibregl.Marker()
    .setLngLat([lon,lat])
    .addTo(map);

  const weather = await fetch(
    `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,precipitation,wind_speed_10m`
  ).then(r=>r.json());

  const w = weather.current;

  document.getElementById("result").innerHTML = `
    ${place.name}<br>
    🌡 ${w.temperature_2m} °C<br>
    🌧 ${w.precipitation} mm<br>
    💨 ${w.wind_speed_10m} km/h
  `;
}
</script>

</body>
</html>
